services:
  # ==========================
  # Backend API
  # ==========================
  - type: web
    name: msrit-backend
    runtime: python
    rootDir: msrit-scraper

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    autoDeploy: true

    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: FERNET_KEY
        sync: false

      - key: NOTIFICATION_SERVICE_URL
        sync: false

      - key: ATTENDANCE_THRESHOLD
        value: "75"

      - key: EMAILS_CSV_PATH
        value: emails.csv

  # ==========================
  # Notification Service
  # ==========================
  - type: web
    name: msrit-notification
    runtime: python
    rootDir: notification-service

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    autoDeploy: true

    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: SMTP_SERVER
        value: smtp.gmail.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: ALERT_SENDER
        sync: false